name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/harness-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix packages/harness-plugin --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: node scripts/install.mjs --help
